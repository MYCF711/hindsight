name: Coding Agents Compat CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'hindsight-integrations/coding-agents/**'
      - '.github/workflows/coding-agents-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hindsight-integrations/coding-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm ci
      - run: node node_modules/vitest/vitest.mjs run src/dsh.test.ts src/transcript-dsh.test.ts
      - run: node node_modules/vitest/vitest.mjs run src/installer.test.ts -t "declares a DSH engine range"
      - run: npm run build
